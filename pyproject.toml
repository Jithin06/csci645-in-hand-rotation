[project]
name = "in-hand-rotation-mjlab"
version = "0.1.0"
description = "In-hand cube rotation task using LEAP hand in MuJoCo with mjlab"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mjlab",
  "mujoco~=3.11.0",
  "mujoco-warp~=3.11.0",
  "warp-lang>=1.14.0",
  "torch==2.9.0",
  "torchvision==0.24.0",
  "pyzmq>=25",
  "scipy",
]

[tool.uv]
package = true
no-sources-package = ["mujoco"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", tag = "v1.6.0" }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }